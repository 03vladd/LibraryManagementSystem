<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${loan.id != null ? 'Edit Loan' : 'Create Loan'}">Form</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        input[type="date"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        input[type="date"]:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }
        .multi-select {
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 5px;
        }
        .multi-select option {
            padding: 5px;
        }
        .hint {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }
        button, .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-save {
            background: #667eea;
            color: white;
        }
        .btn-save:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }
        .btn-cancel {
            background: #e9ecef;
            color: #333;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-cancel:hover {
            background: #dee2e6;
        }
        .error {
            color: #dc3545;
            font-size: 13px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1 th:text="${loan.id != null ? 'Edit Loan' : 'Create New Loan'}"></h1>

    <form th:object="${loan}"
          th:action="${loan.id != null ? '/loans/' + loan.id : '/loans'}"
          method="post">

        <div class="form-group">
            <label for="date">Loan Date *</label>
            <input type="date" id="date" th:field="*{date}" required>
            <div class="error" th:if="${#fields.hasErrors('date')}" th:errors="*{date}"></div>
        </div>

        <div class="form-group">
            <label for="member">Member *</label>
            <select id="member" th:field="*{member.id}" required>
                <option value="">-- Select a Member --</option>
                <option th:each="m : ${members}"
                        th:value="${m.id}"
                        th:text="${m.name}"></option>
            </select>
            <div class="error" th:if="${#fields.hasErrors('member')}" th:errors="*{member}"></div>
        </div>

        <div class="form-group">
            <label for="items">Readable Items</label>
            <select id="items" th:field="*{items}" multiple class="multi-select">
                <option th:each="item : ${items}"
                        th:value="${item.id}"
                        th:text="${item.title}"></option>
            </select>
            <div class="hint">Hold Ctrl (Cmd on Mac) to select multiple items</div>
            <div class="error" th:if="${#fields.hasErrors('items')}" th:errors="*{items}"></div>
        </div>

        <div class="button-group">
            <button type="submit" class="btn-save">
                <span th:text="${loan.id != null ? 'Update Loan' : 'Create Loan'}"></span>
            </button>
            <a href="/loans" class="btn btn-cancel">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
