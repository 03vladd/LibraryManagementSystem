<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${bookAuthor.id != null ? 'Edit Book-Author Relation' : 'Create Book-Author Relation'}">Form</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }
        button, .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-save {
            background: #667eea;
            color: white;
        }
        .btn-save:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .btn-cancel {
            background: #e9ecef;
            color: #333;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-cancel:hover {
            background: #dee2e6;
        }
        .error {
            color: #dc3545;
            font-size: 13px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1 th:text="${bookAuthor.id != null ? 'Edit Book-Author Relation' : 'Create New Relation'}"></h1>

    <form th:object="${bookAuthor}"
          th:action="${bookAuthor.id != null ? '/bookauthors/' + bookAuthor.id : '/bookauthors'}"
          method="post">

        <div class="form-group">
            <label for="book">Book *</label>
            <select id="book" th:field="*{book.id}" required>
                <option value="">-- Select a Book --</option>
                <option th:each="b : ${books}"
                        th:value="${b.id}"
                        th:text="${b.title}"></option>
            </select>
            <div class="error" th:if="${#fields.hasErrors('book')}" th:errors="*{book}"></div>
        </div>

        <div class="form-group">
            <label for="author">Author *</label>
            <select id="author" th:field="*{author.id}" required>
                <option value="">-- Select an Author --</option>
                <option th:each="a : ${authors}"
                        th:value="${a.id}"
                        th:text="${a.name}"></option>
            </select>
            <div class="error" th:if="${#fields.hasErrors('author')}" th:errors="*{author}"></div>
        </div>

        <div class="button-group">
            <button type="submit" class="btn-save">
                <span th:text="${bookAuthor.id != null ? 'Update Relation' : 'Create Relation'}"></span>
            </button>
            <a href="/bookauthors" class="btn btn-cancel">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
