<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Authors</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        h1 {
            color: #333;
        }
        .btn-primary {
            background: #667eea;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .no-data {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th {
            background: #f8f9fa;
            padding: 15px;
            text-align: left;
            color: #333;
            font-weight: 600;
            border-bottom: 2px solid #ddd;
        }
        td {
            padding: 15px;
            border-bottom: 1px solid #ddd;
        }
        tr:hover {
            background: #f8f9fa;
        }
        .actions {
            display: flex;
            gap: 10px;
        }
        .btn-edit, .btn-delete {
            padding: 6px 12px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-edit {
            background: #28a745;
            color: white;
        }
        .btn-edit:hover {
            background: #218838;
        }
        .btn-delete {
            background: #dc3545;
            color: white;
        }
        .btn-delete:hover {
            background: #c82333;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Book-Author Relations</h1>
        <a href="/bookauthors/new" class="btn-primary">+ New Relation</a>
    </div>

    <div th:if="${bookAuthors.isEmpty()}" class="no-data">
        <p>No book-author relations found. Click "New Relation" to create one.</p>
    </div>

    <table th:unless="${bookAuthors.isEmpty()}">
        <thead>
        <tr>
            <th>ID</th>
            <th>Book Title</th>
            <th>Author Name</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="ba : ${bookAuthors}">
            <td th:text="${ba.id}"></td>
            <td th:text="${ba.book != null ? ba.book.title : 'N/A'}"></td>
            <td th:text="${ba.author != null ? ba.author.name : 'N/A'}"></td>
            <td>
                <div class="actions">
                    <a th:href="@{/bookauthors/{id}/edit(id=${ba.id})}" class="btn-edit">Edit</a>
                    <form th:action="@{/bookauthors/{id}/delete(id=${ba.id})}" method="post" style="display: inline;">
                        <button type="submit" class="btn-delete" onclick="return confirm('Are you sure?')">Delete</button>
                    </form>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
