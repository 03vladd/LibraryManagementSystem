<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${reservation.id != null ? 'Edit Reservation' : 'Create Reservation'}">Form</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        input[type="date"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        input[type="date"]:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }
        button, .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-save {
            background: #667eea;
            color: white;
        }
        .btn-save:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }
        .btn-cancel {
            background: #e9ecef;
            color: #333;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-cancel:hover {
            background: #dee2e6;
        }
        .error {
            color: #dc3545;
            font-size: 13px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1 th:text="${reservation.id != null ? 'Edit Reservation' : 'Create New Reservation'}"></h1>

    <form th:object="${reservation}"
          th:action="${reservation.id != null ? '/reservations/' + reservation.id : '/reservations'}"
          method="post">

        <div class="form-group">
            <label for="reservationDate">Reservation Date *</label>
            <input type="date" id="reservationDate" th:field="*{reservationDate}" required>
            <div class="error" th:if="${#fields.hasErrors('reservationDate')}" th:errors="*{reservationDate}"></div>
        </div>

        <div class="form-group">
            <label for="loan">Loan *</label>
            <select id="loan" th:field="*{loan.id}" required>
                <option value="">-- Select a Loan --</option>
                <option th:each="l : ${loans}"
                        th:value="${l.id}"
                        th:text="${'Loan ' + l.id + ' - ' + l.member.name}"></option>
            </select>
            <div class="error" th:if="${#fields.hasErrors('loan')}" th:errors="*{loan}"></div>
        </div>

        <div class="form-group">
            <label for="readableItem">Readable Item *</label>
            <select id="readableItem" th:field="*{readableItem.id}" required>
                <option value="">-- Select an Item --</option>
                <option th:each="item : ${items}"
                        th:value="${item.id}"
                        th:text="${item.title}"></option>
            </select>
            <div class="error" th:if="${#fields.hasErrors('readableItem')}" th:errors="*{readableItem}"></div>
        </div>

        <div class="form-group">
            <label for="status">Status *</label>
            <select id="status" th:field="*{status}" required>
                <option value="">-- Select Status --</option>
                <option value="Active">Active</option>
                <option value="Cancelled">Cancelled</option>
                <option value="Completed">Completed</option>
            </select>
            <div class="error" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
        </div>

        <div class="button-group">
            <button type="submit" class="btn-save">
                <span th:text="${reservation.id != null ? 'Update Reservation' : 'Create Reservation'}"></span>
            </button>
            <a href="/reservations" class="btn btn-cancel">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
