<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservations</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        h1 { color: #333; }
        .btn-primary {
            background: #667eea;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: 600;
        }
        .btn-primary:hover { background: #5568d3; }
        .no-data {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th {
            background: #f8f9fa;
            padding: 12px;
            text-align: left;
            color: #333;
            font-weight: 600;
            border-bottom: 2px solid #ddd;
        }
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }
        tr:hover { background: #f8f9fa; }
        .status {
            padding: 4px 8px;
            border-radius: 3px;
            font-weight: 600;
            font-size: 12px;
        }
        .status-active {
            background: #d4edda;
            color: #155724;
        }
        .status-cancelled {
            background: #f8d7da;
            color: #721c24;
        }
        .status-completed {
            background: #cce5ff;
            color: #004085;
        }
        .actions { display: flex; gap: 10px; }
        .btn-edit, .btn-delete {
            padding: 6px 12px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            border: none;
            cursor: pointer;
        }
        .btn-edit {
            background: #28a745;
            color: white;
        }
        .btn-edit:hover { background: #218838; }
        .btn-delete {
            background: #dc3545;
            color: white;
        }
        .btn-delete:hover { background: #c82333; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Reservations</h1>
        <a href="/reservations/new" class="btn-primary">+ New Reservation</a>
    </div>

    <div th:if="${reservations.isEmpty()}" class="no-data">
        <p>No reservations found. Click "New Reservation" to create one.</p>
    </div>

    <table th:unless="${reservations.isEmpty()}">
        <thead>
        <tr>
            <th>ID</th>
            <th>Loan</th>
            <th>Item</th>
            <th>Date</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="res : ${reservations}">
            <td th:text="${res.id}"></td>
            <td th:text="${res.loan != null ? 'Loan ' + res.loan.id : 'N/A'}"></td>
            <td th:text="${res.readableItem != null ? res.readableItem.title : 'N/A'}"></td>
            <td th:text="${res.reservationDate}"></td>
            <td>
                        <span th:class="'status ' + 'status-' + ${#strings.toLowerCase(res.status)}"
                              th:text="${res.status}"></span>
            </td>
            <td>
                <div class="actions">
                    <a th:href="@{/reservations/{id}/edit(id=${res.id})}" class="btn-edit">Edit</a>
                    <form th:action="@{/reservations/{id}/delete(id=${res.id})}" method="post" style="display: inline;">
                        <button type="submit" class="btn-delete" onclick="return confirm('Are you sure?')">Delete</button>
                    </form>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
