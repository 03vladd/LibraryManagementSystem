<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libraries</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        h1 { color: #333; }
        .btn-primary {
            background: #667eea;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: 600;
        }
        .btn-primary:hover { background: #5568d3; }
        .no-data {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th {
            background: #f8f9fa;
            padding: 12px;
            text-align: left;
            color: #333;
            font-weight: 600;
            border-bottom: 2px solid #ddd;
        }
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }
        tr:hover { background: #f8f9fa; }
        .actions { display: flex; gap: 10px; }
        .btn-edit, .btn-delete {
            padding: 6px 12px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            border: none;
            cursor: pointer;
        }
        .btn-edit {
            background: #28a745;
            color: white;
        }
        .btn-edit:hover { background: #218838; }
        .btn-delete {
            background: #dc3545;
            color: white;
        }
        .btn-delete:hover { background: #c82333; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Libraries</h1>
        <a href="/libraries/new" class="btn-primary">+ New Library</a>
    </div>

    <div th:if="${libraries.isEmpty()}" class="no-data">
        <p>No libraries found. Click "New Library" to create one.</p>
    </div>

    <table th:unless="${libraries.isEmpty()}">
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Address</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="lib : ${libraries}">
            <td th:text="${lib.id}"></td>
            <td th:text="${lib.name}"></td>
            <td th:text="${lib.address}"></td>
            <td th:text="${lib.email}"></td>
            <td th:text="${lib.phoneNumber}"></td>
            <td>
                <div class="actions">
                    <a th:href="@{/libraries/{id}/edit(id=${lib.id})}" class="btn-edit">Edit</a>
                    <form th:action="@{/libraries/{id}/delete(id=${lib.id})}" method="post" style="display: inline;">
                        <button type="submit" class="btn-delete" onclick="return confirm('Are you sure?')">Delete</button>
                    </form>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
