<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${member.id != null ? 'Edit Member' : 'Create Member'}">Form</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        input[type="text"], input[type="email"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        input[type="text"]:focus, input[type="email"]:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }
        button, .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-save {
            background: #667eea;
            color: white;
        }
        .btn-save:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }
        .btn-cancel {
            background: #e9ecef;
            color: #333;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-cancel:hover {
            background: #dee2e6;
        }
        .error {
            color: #dc3545;
            font-size: 13px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1 th:text="${member.id != null ? 'Edit Member' : 'Create New Member'}"></h1>

    <form th:object="${member}"
          th:action="${member.id != null ? '/members/' + member.id : '/members'}"
          method="post">

        <div class="form-group">
            <label for="name">Name *</label>
            <input type="text" id="name" th:field="*{name}" required>
            <div class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <div class="form-group">
            <label for="email">Email *</label>
            <input type="email" id="email" th:field="*{email}" required>
            <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>

        <div class="form-group">
            <label for="phoneNumber">Phone Number *</label>
            <input type="text" id="phoneNumber" th:field="*{phoneNumber}" required>
            <div class="error" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></div>
        </div>

        <div class="form-group">
            <label for="address">Address *</label>
            <input type="text" id="address" th:field="*{address}" required>
            <div class="error" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
        </div>

        <div class="form-group">
            <label for="library">Library *</label>
            <select id="library" th:field="*{library.id}" required>
                <option value="">-- Select a Library --</option>
                <option th:each="lib : ${libraries}"
                        th:value="${lib.id}"
                        th:text="${lib.name}"></option>
            </select>
            <div class="error" th:if="${#fields.hasErrors('library')}" th:errors="*{library}"></div>
        </div>

        <div class="button-group">
            <button type="submit" class="btn-save">
                <span th:text="${member.id != null ? 'Update Member' : 'Create Member'}"></span>
            </button>
            <a href="/members" class="btn btn-cancel">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
