<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magazines - LMS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .header p {
            color: #95a5a6;
            margin-top: 5px;
            font-size: 14px;
        }
        .btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            text-decoration: none;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(245, 87, 108, 0.4);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(245, 87, 108, 0.6);
        }
        .btn-details {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 10px 18px;
            font-size: 14px;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.4);
        }
        .btn-details:hover {
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.6);
            transform: translateY(-2px);
        }
        .btn-edit {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            box-shadow: 0 2px 8px rgba(17, 153, 142, 0.4);
            padding: 10px 18px;
            font-size: 14px;
        }
        .btn-edit:hover {
            box-shadow: 0 4px 12px rgba(17, 153, 142, 0.6);
            transform: translateY(-2px);
        }
        .btn-danger {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
            padding: 10px 18px;
            font-size: 14px;
            box-shadow: 0 2px 8px rgba(235, 51, 73, 0.4);
        }
        .btn-danger:hover {
            box-shadow: 0 4px 12px rgba(235, 51, 73, 0.6);
            transform: translateY(-2px);
        }
        table {
            width: 100%;
            background: white;
            border-collapse: collapse;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
        }
        th {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            padding: 16px 12px;
            text-align: left;
            font-weight: 600;
            color: white;
            letter-spacing: 0.5px;
        }
        td {
            padding: 14px 12px;
            border-bottom: 1px solid #ecf0f1;
            color: #2c3e50;
        }
        tbody tr {
            transition: all 0.2s ease;
        }
        tbody tr:hover {
            background: #fef5f8;
            box-shadow: inset 0 0 10px rgba(245, 87, 108, 0.1);
        }
        .actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        form {
            display: inline;
            margin: 0;
        }
        .empty-state {
            background: white;
            padding: 60px 30px;
            border-radius: 12px;
            text-align: center;
            color: #7f8c8d;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .empty-state h2 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 24px;
        }
        .empty-state a {
            display: inline-block;
            margin-top: 20px;
            color: #f5576c;
            text-decoration: none;
            font-weight: 600;
        }
        .empty-state a:hover {
            text-decoration: underline;
        }
        .id-badge {
            font-weight: 600;
            color: #f5576c;
            background: #ffe5ec;
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
            min-width: 40px;
            text-align: center;
        }
        .title-cell {
            font-weight: 500;
            color: #2c3e50;
        }
        .publisher-cell {
            color: #7f8c8d;
            font-size: 13px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div>
            <h1>📰 Magazines</h1>
            <p>Manage magazine details and inventory</p>
        </div>
        <a href="/magazines/new" class="btn">+ Create Magazine</a>
    </div>

    <table th:if="${magazines.size() > 0}">
        <thead>
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Publisher</th>
            <th>Copies</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="magazine : ${magazines}">
            <td><span class="id-badge" th:text="${magazine.id}"></span></td>
            <td class="title-cell" th:text="${magazine.title}"></td>
            <td class="publisher-cell" th:text="${magazine.publisher}"></td>
            <td th:text="${magazine.copies.size()}"></td>
            <td>
                <div class="actions">
                    <a th:href="@{/magazines/{id}/details(id=${magazine.id})}" class="btn btn-details">👁️ Details</a>
                    <a th:href="@{/magazines/{id}/edit(id=${magazine.id})}" class="btn btn-edit">✏️ Edit</a>
                    <form th:action="@{/magazines/{id}/delete(id=${magazine.id})}" method="post" style="display:inline;">
                        <button type="submit" class="btn btn-danger" onclick="return confirm('Are you sure you want to delete this magazine?')">🗑️ Delete</button>
                    </form>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
    <div th:if="${magazines.size() == 0}" class="empty-state">
        <h2>📭 No Magazines Yet</h2>
        <p>Start by adding your first magazine to the library system.</p>
        <a href="/magazines/new" class="btn">+ Create Your First Magazine</a>
    </div>
</div>
</body>
</html>
